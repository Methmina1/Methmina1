
name: Generate 3D GitHub Contribution Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@0.9.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Methmina1

      - name: Verify generated files
        run: |
          ls -la profile-3d-contrib/
          test -s profile-3d-contrib/profile-night-rainbow.svg

      - name: Commit and push calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if ! git diff --cached --quiet; then
            git commit -m "Update 3D GitHub contribution calendar"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
